services:
  app:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: tic-tac-toe-app
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    command: sh -c "npm install && npm start"
    networks:
      - app-network

  storybook:
    build:
      context: .
      dockerfile: Dockerfile.storybook
    container_name: tic-tac-toe-storybook
    ports:
      - "6006:80"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
