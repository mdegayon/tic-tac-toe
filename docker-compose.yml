services:
  react-app:
    build: .
    container_name: react-app
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    environment:
      - CHOKIDAR_USEPOLLING=true  # To make sure React's detecting any file change (útil en Mac/Windows)
      - WATCHPACK_POLLING=true
    command: npm start
